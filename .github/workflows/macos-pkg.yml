name: macOS package

on:
  push:
    branches: [release]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Lint scripts
        run: |
          shellcheck macos/packaging/build-pkg.sh macos/packaging/check-pkg.sh macos/packaging/version.sh \
            macos/install-userspace.command macos/uninstall-userspace.command
          shellcheck --shell=bash macos/packaging/uninstall.sh macos/packaging/scripts/preinstall macos/packaging/scripts/postinstall
      - name: Engine tests
        run: make -C tests check
      - name: Daemon tests
        run: make -C macos/Backends/OzzyDaemon check
      - name: Plug-in backend tests (fake-daemon)
        run: make -C macos/Backends/OzzyDaemon/tools check
      - name: Build package
        run: macos/packaging/build-pkg.sh
      - name: Check package
        run: |
          v="$(cat macos/build/pkg/VERSION)"
          macos/packaging/check-pkg.sh "macos/build/pkg/Ozzy-CMS600-$v.pkg" "$v"
      - uses: actions/upload-artifact@v7
        with:
          name: ozzy-cms600-pkg
          path: |
            macos/build/pkg/*.pkg
            macos/build/pkg/*.sha256
            macos/build/pkg/VERSION
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: ozzy-cms600-pkg
          path: dist
      - name: Check the tag is on release and matches the package
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release || { echo "$GITHUB_REF_NAME is not on release"; exit 1; }
          [ "v$(cat dist/VERSION)" = "$GITHUB_REF_NAME" ] || { echo "package version $(cat dist/VERSION) != $GITHUB_REF_NAME"; exit 1; }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat dist/VERSION)"
          args=(--draft --verify-tag --title "Ozzy for Dynacord CMS 600-3 $v" --notes-file macos/packaging/release-notes.md)
          # v0.4.0-rc.1 and the like: a pre-release, so the latest release stays the last full one
          case "$v" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "dist/Ozzy-CMS600-$v.pkg" "dist/Ozzy-CMS600-$v.pkg.sha256"
